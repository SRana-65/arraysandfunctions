
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Array Operations</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript File -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">

        <h1>Array Operations</h1>

        <p class="description">
            Enter numbers separated by commas to perform array operations.
        </p>

        <div class="input-section">

            <label for="numbersInput">Enter Your Numbers</label>

            <input
                type="text"
                id="numbersInput"
                placeholder="Example: 4, 8, 2, 11, 6, 7, 10"
            >

            <button id="calculateBtn">
                Calculate Results
            </button>

        </div>

        <div class="results-section">

            <h2>Results</h2>

            <div id="result">
                <p>Your results will appear here.</p>
            </div>

        </div>

    </div>

</body>
</html>
